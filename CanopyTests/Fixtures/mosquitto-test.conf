# Broker for CanopyTests/BrokerIntegrationTests.swift. Paths are relative to the
# project directory, so start mosquitto from there.
per_listener_settings true

listener 18830 127.0.0.1
allow_anonymous true

listener 18831 127.0.0.1
allow_anonymous true
cafile CanopyTests/Fixtures/test-ca.pem
certfile CanopyTests/Fixtures/test-server.pem
keyfile CanopyTests/Fixtures/test-server.key

listener 18832 127.0.0.1
allow_anonymous true
cafile CanopyTests/Fixtures/test-ca.pem
certfile CanopyTests/Fixtures/test-server.pem
keyfile CanopyTests/Fixtures/test-server.key
require_certificate true
